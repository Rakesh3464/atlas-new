name: One UI 9 donor / A21s VNDK31 compatibility (READ ONLY)
on:
  push:
    branches: [a21s-ui9-vndk31-donor-compat]
    paths:
      - '.github/workflows/a21s-ui9-donor-vndk31.yml'
      - 'scripts/a21s_ui9_donor_vendor_compat.py'
  workflow_dispatch:
jobs:
  inspect-framework-vendor:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout read-only compatibility audit script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: scripts/a21s_ui9_donor_vendor_compat.py
          sparse-checkout-cone-mode: false
      - name: Download verified donor ROM and A21s vendor ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs reports
          python3 -m pip install --quiet --user gdown
          export PATH="$HOME/.local/bin:$PATH"
          gdown '1ed87QvTjOgiGnPhmMsRbexbWhUWjtjKY' --output inputs/donor.zip
          gdown '1WtbOVAksZW5TTLHT1UuWOyhBwu0IyH3s' --output inputs/a21s-vendor.zip
          test "$(stat -c %s inputs/donor.zip)" -gt 3000000000
          test "$(stat -c %s inputs/a21s-vendor.zip)" -eq 480361676
          echo '60a39482f3baba166627c4b784ad103fc0f10f83c36148291fb91071bcf7eb86  inputs/donor.zip' | sha256sum -c -
          echo '39c3315fa5f164e1ddeba3fd2cfae85240e21a5ac61d8287d34e0b1b42136385  inputs/a21s-vendor.zip' | sha256sum -c -
      - name: Extract donor super.img to temporary runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          src=Path("inputs/donor.zip")
          target=Path("inputs/donor-super.img")
          with zipfile.ZipFile(src) as z:
              candidates=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="super.img"]
              if len(candidates)!=1:
                  raise ValueError("Expected one donor super.img")
              info=z.getinfo(candidates[0])
              if info.file_size!=6382682112:
                  raise ValueError(f"Unexpected donor super size {info.file_size}")
              with z.open(info) as f, target.open("wb") as w:
                  shutil.copyfileobj(f,w,length=16*1024*1024)
          src.unlink()
          print("Temporary donor super extracted. No disk partition was flashed.")
          PY
          df -h .
      - name: Inspect donor system/product/odm vs target vendor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs
          python3 scripts/a21s_ui9_donor_vendor_compat.py \
            inputs/donor-super.img \
            inputs/a21s-vendor.zip \
            reports
      - name: Upload compatibility report only (no images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-ui9-donor-vndk31-compat-NOT-FLASHABLE
          path: reports/donor-vndk31-compat.md
          if-no-files-found: ignore
