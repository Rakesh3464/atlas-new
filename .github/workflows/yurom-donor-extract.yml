name: YuROM donor system extraction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify donor system
        run: |
          python -m pip install gdown
          mkdir -p output
          python - <<'PY'
          import hashlib, subprocess, zipfile, pathlib
          ids = ['1lllRAH4E6t44a06az4-JHJRtV0pzXZpF','1BEU5kKahomLbKFcW8y7mTDJgQjmA7dc6','1ljy0zGkWqYk72UJ6fPD1FIf2SeyrZcTS','1woA9AO_6n_PJz9SF1PvNsfnvmtaxP-7n','1w218yGYSZbUuv-4KC5K3GSkW-PDD_ZqU']
          hashes = ['1207f5df51e8cede69f28165c048f7d5174223136402affcd703ee34a76ea3cf','80eb2635db911248a00cc47769b1701eb31acac7dc6133922d8e1ad6dff951c1','e2a936a43cb57f5b78153e87c61e5ae68982083755de63f2ca10e3d43ba043b5','5d3e84f44c41a43a937295f2509e9aaedbddefeb6bf0909083bc580bc182da64','a0028479acb531974cc47812a7b2afd1f7ba1fb22a74dc19e29218537e326671']
          full=hashlib.sha256()
          with open('output/system.img','wb') as out:
              for i,(id,expected) in enumerate(zip(ids,hashes)):
                  p=pathlib.Path('data.zip')
                  subprocess.run(['gdown',id,'-O',str(p)],check=True)
                  with p.open('rb') as f:
                      assert hashlib.file_digest(f,'sha256').hexdigest()==expected, 'ZIP checksum mismatch'
                  with zipfile.ZipFile(p) as z:
                      for n in ([i] if i<4 else [4,5]):
                          with z.open(f'images/system/{n:04d}.part') as src:
                              while b:=src.read(8*1024*1024):
                                  out.write(b); full.update(b)
                  p.unlink()
          assert pathlib.Path('output/system.img').stat().st_size==5822324736
          assert full.hexdigest()=='4754c6adaedf461fcca7b942ce4941366e3223e597a672c24ebe0a18dc10940f'
          PY
          file output/system.img
          sha256sum output/system.img > output/SHA256SUMS
          split -b 1900M -d output/system.img output/system.img.part-
          rm output/system.img
      - uses: actions/upload-artifact@v4
        with:
          name: YuROM-donor-system-NOT-FLASHABLE
          path: output/
          compression-level: 0
          retention-days: 3
