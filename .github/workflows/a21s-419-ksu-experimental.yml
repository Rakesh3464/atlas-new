name: A21s 4.19 KernelSU experimental compile
on:
  workflow_dispatch:
  push:
    branches: [a21s-419-ksu-susfs]
jobs:
  ksu:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev clang lld llvm python3 ccache
      - name: Wire existing KernelSU source into kernel build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          echo "KernelSU source candidates:" | tee logs/wiring.txt
          ls -ld KernelSU KernelSU/kernel drivers/kernelsu 2>&1 | tee -a logs/wiring.txt || true
          find KernelSU -maxdepth 3 -name Kconfig -o -name Makefile | head -60 | tee -a logs/wiring.txt
          if [ ! -f KernelSU/kernel/Kconfig ] || [ ! -f KernelSU/kernel/Makefile ]; then
            echo 'ERROR: KernelSU/kernel build files absent' | tee -a logs/wiring.txt
            exit 1
          fi
          if [ -L drivers/kernelsu ]; then
            echo 'Existing drivers/kernelsu symlink detected' | tee -a logs/wiring.txt
          elif [ -d drivers/kernelsu ]; then
            echo 'Existing drivers/kernelsu directory detected; preserving its contents' | tee -a logs/wiring.txt
            if [ ! -f drivers/kernelsu/Kconfig ] || [ ! -f drivers/kernelsu/Makefile ]; then
              echo 'ERROR: existing directory lacks required build files; manual integration needed' | tee -a logs/wiring.txt
              exit 1
            fi
          else
            ln -s ../../KernelSU/kernel drivers/kernelsu
            echo 'Created temporary drivers/kernelsu symlink' | tee -a logs/wiring.txt
          fi
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          git -C KernelSU rev-parse HEAD | tee logs/ksu-revision.txt
          echo 'Temporary CI symlink; no source files or master branch modified.' | tee logs/integration.txt
      - name: Configure and build KernelSU-enabled Image
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          make O=out ARCH=arm64 LLVM=1 exynos850-a21snsxx_defconfig 2>&1 | tee logs/config.log
          bash scripts/config --file out/.config -e KSU
          make O=out ARCH=arm64 LLVM=1 olddefconfig 2>&1 | tee logs/olddefconfig.log
          grep '^CONFIG_KSU=y' out/.config | tee logs/ksu-enabled.txt
          make -j2 O=out ARCH=arm64 LLVM=1 Image 2>&1 | tee logs/build.log
          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee logs/image-sha256.txt
      - name: Upload diagnostic logs and experimental Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-419-ksu-experimental
          path: |
            logs/
            out/.config
            out/arch/arm64/boot/Image
          if-no-files-found: ignore
