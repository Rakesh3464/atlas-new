name: A21s kernel build preflight
on:
  push:
    branches: [master, a21s-susfs-fscontext-port-test]
    paths:
      - '.github/workflows/a21s-kernel-preflight.yml'
      - 'scripts/a21s-apply-susfs.sh'
      - 'scripts/a21s-port-susfs.py'
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'A21s defconfig relative to arch/arm64/configs (blank: auto-select exynos850-a21snsxx_defconfig)'
        required: false
        type: string
jobs:
  inspect-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify SUSFS patch scripts before installing toolchain
        run: |
          bash -n scripts/a21s-apply-susfs.sh
          python3 -m py_compile scripts/a21s-port-susfs.py
      - name: Install cross-compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git patch ccache bc bison flex libssl-dev libelf-dev python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu
      - name: Inspect source and discover defconfigs
        shell: bash
        run: |
          set -eu
          echo "Kernel Makefile version:"
          sed -n '1,6p' Makefile
          echo "Declared DEFCONFIG in Samsung build config:"
          grep "^DEFCONFIG=" build.config.universal3830 || true
          echo "A21s actual defconfig:"
          ls -l arch/arm64/configs/exynos850-a21snsxx_defconfig
          echo "KernelSU submodule status:"
          git submodule status || true
          test -f KernelSU/kernel/Kconfig || { echo "KernelSU submodule missing: KernelSU/kernel/Kconfig"; exit 1; }
          test -f KernelSU/kernel/Makefile || { echo "KernelSU submodule missing: KernelSU/kernel/Makefile"; exit 1; }
          echo "Candidate Exynos 850 / A21s configurations:"
          find arch/arm64/configs -type f \( -iname '*850*' -o -iname '*a21*' -o -iname '*exynos*' \) | sed -n '1,100p'
          echo "KernelSU and SUSFS source indicators:"
          find . -maxdepth 6 -type f \( -iname '*susfs*' -o -path '*/KernelSU/*' -o -path '*/kernelsu/*' \) | sed -n '1,60p'
      - name: Apply SUSFS kernel and KernelSU integration patches
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          mkdir -p diagnostics
          set -o pipefail
          bash scripts/a21s-apply-susfs.sh 2>&1 | tee diagnostics/susfs-patch.log
      - name: Compile selected A21s defconfig
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          DEFCONFIG: ${{ inputs.defconfig || 'exynos850-a21snsxx_defconfig' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEFCONFIG" in
            *..*|/*|*\\*) echo "Unsafe defconfig path"; exit 1;;
          esac
          test -f "arch/arm64/configs/$DEFCONFIG" || { echo "Missing source defconfig: $DEFCONFIG; source config or target must be restored before building."; exit 1; }
          mkdir -p diagnostics
          make O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- "$DEFCONFIG" 2>&1 | tee diagnostics/defconfig.log
          echo "Validating KernelSU and SUSFS in effective .config"
          for setting in CONFIG_KSU=y CONFIG_KSU_SUSFS=y; do
            if ! grep -Fxq "$setting" out/.config; then
              echo "ERROR: Required setting $setting was not enabled by Kconfig. Aborting." | tee -a diagnostics/defconfig.log
              exit 1
            fi
          done
          make -j2 O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image 2>&1 | tee diagnostics/compile.log
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/Image
      - name: Upload compiled kernel only (never flash automatically)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: a21s-kernel-UNTESTED
          path: artifacts/Image
          if-no-files-found: error

      - name: Upload SUSFS and compile diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-susfs-build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
