name: A21s OneUI9 VNDK31 FCM4 system_ext full paths (READ ONLY)
on:
  push:
    branches: [a21s-ui9-vndk31-full-path-audit]
    paths:
      - 'scripts/a21s_ui9_vndk31_full_path_scan.py'
      - '.github/workflows/a21s-ui9-vndk31-full-path.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  check-systemext:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - name: Checkout read-only scanner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            scripts/a21s_ui9_vndk31_full_path_scan.py
            scripts/a21s_ui9_donor_vendor_compat.py
          sparse-checkout-cone-mode: false
      - name: Download previously validated 10GiB experimental assembly parts (NO FLASH)
        uses: actions/download-artifact@v4
        with:
          run-id: 45162727671
          pattern: A21s-OneUI9-EXPERIMENTAL-PART-*
          path: inputs/parts
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Extract the archived sparse super image in isolated GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test "$(find inputs/parts -name '*.part-*' -type f | wc -l)" -eq 7
          cat inputs/parts/*.part-* | zstd -dc | tar -xf - -C inputs/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('inputs/BUILD_MANIFEST.json').read_text())
          p=Path('inputs/super-10GiB-PHOTO-UNVERIFIED.img')
          assert m['lpmake_assumed_device_size_bytes']==10737418240
          assert m['result_super']==p.name
          h=hashlib.sha256()
          with p.open('rb') as f:
              for chunk in iter(lambda:f.read(16*1024*1024),b''):h.update(chunk)
          assert h.hexdigest()==m['output_sha256'], 'Experimental super hash mismatch'
          print('Experimental super image hash verified. Still NOT flashable.')
          PY
          rm -rf inputs/parts
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs
          simg2img inputs/super-10GiB-PHOTO-UNVERIFIED.img inputs/assembled-super.raw.img
          test "$(stat -c %s inputs/assembled-super.raw.img)" -eq 10737418240
          rm -f inputs/super-10GiB-PHOTO-UNVERIFIED.img
          df -h .
      - name: Mount assembled LP partitions READ ONLY and scan nested system_ext/APEX/FCM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/a21s_ui9_vndk31_full_path_scan.py inputs/assembled-super.raw.img reports
      - name: Upload only the textual compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A21s-OneUI9-VNDK31-FCM4-FULL-PATH-AUDIT-NOT-FLASHABLE
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
