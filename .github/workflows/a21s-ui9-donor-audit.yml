name: A21s One UI 9 donor partition audit (NO FLASH)
on:
  push:
    branches: [a21s-ui9-donor-audit]
    paths:
      - '.github/workflows/a21s-ui9-donor-audit.yml'
  workflow_dispatch:
jobs:
  audit-donor:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout only the read-only audit script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: scripts/ui9_super_audit.py
          sparse-checkout-cone-mode: false
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Download publicly released SkyUI Cirrus 9.0 donor ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "Attempting public SourceForge download"
          if ! curl --fail --location --retry 1 --retry-delay 4 \
            --connect-timeout 30 --max-time 3000 \
            --user-agent 'Mozilla/5.0' \
            'https://sourceforge.net/projects/skyui-rom/files/Cirrus/SkyUI%20Cirrus%209.0%20-%20M21%20M31%20M31s%20F41.zip/download' \
            --output donor.zip; then
            echo "SourceForge download blocked; trying the user-provided Google Drive file"
            rm -f donor.zip
            python3 -m pip install --user --quiet gdown
            export PATH="$HOME/.local/bin:$PATH"
            gdown \
              'https://drive.google.com/file/d/1ed87QvTjOgiGnPhmMsRbexbWhUWjtjKY/view?usp=drive_link' \
              --output donor.zip
          fi
          test "$(stat -c %s donor.zip)" -gt 1000000000
          file donor.zip
          sha256sum donor.zip | tee reports/donor-sha256.txt
          # SHA256 is recorded, but do not compare against an unverified expected hash.
          # Full ZIP CRC validation detects truncated/corrupted entries.
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          report=Path("reports/donor-zip-integrity.txt")
          with zipfile.ZipFile("donor.zip") as z:
              infos=z.infolist()
              total=sum(i.file_size for i in infos)
              if total > 150_000_000_000:
                  raise ValueError("Suspiciously large uncompressed archive; refusing CRC scan")
              bad=z.testzip()
              if bad is not None:
                  report.write_text(f"CRC test FAILED: {bad}\\n")
                  raise RuntimeError(f"CRC test failed for {bad}")
              report.write_text(
                  f"ZIP CRC PASS\\nEntries: {len(infos)}\\n"
                  f"Uncompressed bytes: {total}\\n"
                  "Origin: user-provided Google Drive link; publisher SHA256 not independently verified\\n"
              )
              print(report.read_text())
          PY
      - name: Inspect partition candidates without extracting or flashing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          out = Path("reports")
          out.mkdir(exist_ok=True)
          partitions = [
              "system", "system_ext", "product", "odm", "vendor",
              "boot", "dtbo", "vbmeta", "vendor_boot", "super", "recovery"
          ]
          with zipfile.ZipFile("donor.zip") as z:
              entries = z.infolist()
              (out / "donor-manifest.txt").write_text(
                  "\n".join(f"{i.file_size:>13} {i.filename}" for i in entries) + "\n"
              )
              lines = [
                  "# SkyUI Cirrus 9.0 donor audit for A21s SM-A217F",
                  "",
                  f"ZIP entries: {len(entries)}",
                  "Donor devices: M21 / M31 / M31s / F41 (not A21s).",
                  "A21s Exynos 850 hardware files must NOT be replaced by Exynos 9611 donor boot, dtbo, or vendor.",
                  "",
                  "## Partition candidate files",
              ]
              for name in partitions:
                  matches = []
                  for item in entries:
                      filename = item.filename.rsplit("/", 1)[-1].lower()
                      if filename == name or filename.startswith(name + ".") or filename.startswith(name + "_"):
                          matches.append(item)
                  lines.append(f"### {name}: {len(matches)} candidate(s)")
                  for item in matches[:30]:
                      lines.append(f"- {item.filename} ({item.file_size} bytes)")
                  if len(matches) > 30:
                      lines.append(f"- ... and {len(matches)-30} more")
              special = [
                  i.filename for i in entries if (
                      i.filename.endswith("payload.bin")
                      or i.filename.endswith("updater-script")
                      or "dynamic_partitions_op_list" in i.filename
                      or "super_empty.img" in i.filename
                  )
              ]
              lines.extend(["", "## Installer / payload candidates"])
              lines.extend(f"- {x}" for x in special[:50])
              lines.extend([
                  "", "## Safety",
                  "This is an ARCHIVE CONTENT AUDIT ONLY. No ROM, boot image, or flashable ZIP was built.",
                  "Do not flash donor M21/M31 kernel/DTBO/vendor to A21s.",
                  "A21s boot.img, dtbo.img, vendor.zip and actual partition sizes need separate compatibility checks.",
              ])
              (out / "donor-audit.md").write_text("\n".join(lines) + "\n")
              print("\n".join(lines))
          PY
      - name: Inspect dynamic partitions inside donor super.img (no extraction or flash)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ui9_super_audit.py donor.zip reports/super-partitions.md
      - name: Upload audit and logs (even if download failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-ui9-donor-audit-NOT-FLASHABLE
          path: reports/
          if-no-files-found: ignore
