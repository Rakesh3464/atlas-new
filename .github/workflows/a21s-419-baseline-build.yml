name: A21s 4.19 baseline kernel compile
on:
  push:
    branches: [a21s-419-ksu-susfs]
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev clang lld llvm python3 ccache
      - name: Preflight KernelSU source wiring
        shell: bash
        run: |
          mkdir -p logs
          git submodule status | tee logs/submodules.txt
          if grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig && [ ! -f drivers/kernelsu/Kconfig ]; then
            echo 'ERROR: drivers/Kconfig references missing drivers/kernelsu/Kconfig' | tee logs/preflight.txt
            echo 'Temporarily disabling dangling KernelSU references in CI checkout ONLY for a baseline test.' | tee -a logs/preflight.txt
            sed -i '/^source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
            sed -i '/^obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
            echo 'KernelSU is NOT included in this baseline Image.' | tee -a logs/preflight.txt
          fi
          echo 'Preflight completed; see logs for KernelSU inclusion status' | tee -a logs/preflight.txt
      - name: Compile existing A21s config without inventing SUSFS integration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          clang --version | head -1 | tee logs/toolchain.txt
          make O=out ARCH=arm64 LLVM=1 exynos850-a21snsxx_defconfig 2>&1 | tee logs/config.log
          make -j2 O=out ARCH=arm64 LLVM=1 Image 2>&1 | tee logs/build.log
      - name: Verify baseline Image and record checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image | tee logs/image-type.txt
          stat -c '%n %s bytes' out/arch/arm64/boot/Image | tee logs/image-size.txt
          sha256sum out/arch/arm64/boot/Image | tee logs/image-sha256.txt
          echo 'Baseline only: KernelSU and SUSFS are not verified in this Image.' | tee logs/image-notice.txt
      - name: Upload logs and kernel if compile succeeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-419-baseline-build
          path: |
            logs/
            out/.config
            out/arch/arm64/boot/Image
          if-no-files-found: ignore
